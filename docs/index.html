<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6f4">
  <meta name="format-detection" content="telephone=no">
  <meta name="color-scheme" content="light">
  <title>車長班表</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <noscript>
    <div style="margin:16px;padding:16px;border-radius:14px;background:#fff;font:14px/1.6 sans-serif;color:#14221a">
      這個頁面需要 JavaScript。請開啟瀏覽器的 JavaScript，或改用 Chrome／Edge 開啟。
    </div>
  </noscript>
  <svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></symbol>
    <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="15" rx="4"/><path d="M5 11h14"/><path d="M9 21l2-3M15 21l-2-3"/><circle cx="9" cy="14.6" r=".9" fill="currentColor" stroke="none"/><circle cx="15" cy="14.6" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c.9-3.4 3.7-5.2 7.2-5.2s6.3 1.8 7.2 5.2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 11-8 11s-8-6-8-11a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.6"/></symbol>
    <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V9Z"/><path d="M17 10h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M8 4v2M12 4v2"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5"/><circle cx="12" cy="17.2" r=".8" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-empty" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15h6"/></symbol>
  </svg>

  <div class="app-shell">
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg class="icon"><use href="#i-train"></use></svg>
        </span>
        <div>
          <p class="brand-sub">CREW SCHEDULE</p>
          <h1 class="brand-title">車長班表</h1>
        </div>
      </div>
      <button class="name-chip is-empty" id="nameBtn" type="button" data-action="open-name" aria-label="設定姓名">
        <span class="avatar"><svg class="icon icon-sm"><use href="#i-user"></use></svg></span>
        <span class="chip-text">設定姓名</span>
        <svg class="icon"><use href="#i-chevron-down"></use></svg>
      </button>
    </header>

    <main id="main" class="main" aria-live="polite">
      <div class="hero is-empty">
        <div class="hero-top"><span class="hero-kicker">LOADING</span></div>
        <div class="hero-shift">正在準備班表…</div>
        <p class="hero-hint">從試算表讀取資料中</p>
      </div>
      <div class="skeleton-card card" style="margin-top:14px">
        <div class="sk sk-line w40"></div>
        <div class="sk sk-block" style="margin-top:12px"></div>
        <div class="sk sk-line w80" style="margin-top:12px"></div>
      </div>
    </main>

    <nav class="tabbar" aria-label="主要導覽">
      <button class="tab active" type="button" data-nav="home">
        <svg class="icon"><use href="#i-home"></use></svg><span>首頁</span>
      </button>
      <button class="tab" type="button" data-nav="search">
        <svg class="icon"><use href="#i-search"></use></svg><span>查詢</span>
      </button>
      <button class="tab" type="button" data-nav="trains">
        <svg class="icon"><use href="#i-train"></use></svg><span>車次</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <datalist id="staffOptions"></datalist>
  <datalist id="stationOptions"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // 若前端程式沒有成功執行（例如瀏覽器太舊、JavaScript 被停用），
    // 把原本的載入骨架換成看得懂的說明，而不是一直停在載入中。
    window.setTimeout(function () {
      if (window.__APP_READY__) return;
      var main = document.getElementById('main');
      if (!main) return;
      main.innerHTML = '<div class="view"><div class="card" style="margin-top:16px;padding:20px">' +
        '<div class="error-card"><strong>頁面沒有成功啟動</strong>' +
        '請重新整理；若仍停住，請改用 Chrome／Edge，並確認瀏覽器已開啟 JavaScript。' +
        '<button type="button" onclick="location.reload()">重新整理</button></div>' +
        '<p style="margin:12px 2px 0;font-size:11px;line-height:1.6;color:#71827a">' +
        '請確認網路連線與 docs/config.js 的 API_URL 設定；本機預覽請執行 test/open-preview.ps1。</p>' +
        '</div></div>';
    }, 5000);
  </script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
